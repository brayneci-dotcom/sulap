services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpdf
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/cloudpdf"
      SECRET_KEY: "dev-secret-key-change-in-production-64-chars-min"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      FRONTEND_URL: "http://localhost:8080"
      LOG_LEVEL: "DEBUG"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: cloudpdf-db
    environment:
      POSTGRES_DB: cloudpdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
