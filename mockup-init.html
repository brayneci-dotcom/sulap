<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSS PDF Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-scale-in { animation: scaleIn 0.2s ease-out; }
        .animate-shimmer { animation: shimmer 2s infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .shimmer-bg { background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        .glass-effect { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .gradient-border { position: relative; }
        .gradient-border::before { content: ''; position: relative; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
        .hover-lift { transition: all 0.2s ease; }
        .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1); }
        .sidebar-active { background: linear-gradient(135deg, #eff6ff, #f0f9ff); border-right: 3px solid #3b82f6; }
        .drag-over { border-color: #3b82f6 !important; background: #eff6ff !important; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="app"></div>

    <script>
        const LOGO_URL = 'https://seeklogo.com/images/B/bank-sahabat-sampoerna-logo-25F1A68043-seeklogo.com.png';

        const MOCK_AUDIT_LOGS = [
            { id: 1, timestamp: '2026-07-31 10:15:00', user: 'budi@company.com', action: 'MERGE', source: 'report1.pdf, report2.pdf', result: 'merged_report.pdf', status: 'SUCCESS', duration: '2.4s', ip: '192.168.1.10' },
            { id: 2, timestamp: '2026-07-31 10:45:22', user: 'siti@company.com', action: 'COMPRESS', source: 'presentation_v1.pdf', result: 'presentation_v1_compressed.pdf', status: 'SUCCESS', duration: '5.1s', ip: '192.168.1.15' },
            { id: 3, timestamp: '2026-07-31 11:05:10', user: 'agus@company.com', action: 'REARRANGE', source: 'contract_draft.pdf', result: 'contract_final.pdf', status: 'SUCCESS', duration: '1.2s', ip: '192.168.1.20' },
            { id: 4, timestamp: '2026-07-31 13:20:05', user: 'budi@company.com', action: 'MERGE', source: 'img1.pdf, img2.pdf', result: '-', status: 'CANCELLED', duration: '0.8s', ip: '192.168.1.10' },
            { id: 5, timestamp: '2026-07-31 14:10:33', user: 'dina@company.com', action: 'COMPRESS', source: 'annual_report.pdf', result: '-', status: 'ERROR', duration: '10.5s', ip: '192.168.1.45' },
            { id: 6, timestamp: '2026-07-31 15:30:12', user: 'siti@company.com', action: 'MERGE', source: 'invoice_jan.pdf, invoice_feb.pdf', result: 'invoices_q1.pdf', status: 'SUCCESS', duration: '3.2s', ip: '192.168.1.15' },
            { id: 7, timestamp: '2026-07-31 16:05:44', user: 'admin@company.com', action: 'REARRANGE', source: 'policy_manual.pdf', result: 'policy_manual_v2.pdf', status: 'SUCCESS', duration: '4.7s', ip: '192.168.1.1' },
        ];

        const formatBytes = (bytes, decimals = 2) => {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        };

        // State
        let state = {
            user: null,
            activeTab: 'dashboard',
            isProcessing: false,
            toast: null,
            isMobileMenuOpen: false,
            mergeFiles: [],
            mergeDragIdx: null,
            compressFile: null,
            compressLevel: 'medium',
            rearrangeFile: null,
            rearrangePages: [],
            rearrangeDragIdx: null,
            auditSearch: '',
            auditFilter: '',
        };

        function render() {
            const app = document.getElementById('app');
            if (!state.user) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderMain();
            }
            lucide.createIcons();
            attachEvents();
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950 p-4 relative overflow-hidden">
                    <!-- Background decorations -->
                    <div class="absolute inset-0 overflow-hidden pointer-events-none">
                        <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
                        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-500/5 rounded-full blur-3xl"></div>
                    </div>

                    <div class="relative z-10 w-full max-w-lg animate-scale-in">
                        <!-- Logo & Title -->
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center gap-4 mb-4">
                                <img src="${LOGO_URL}" alt="BSS Logo" class="h-24 object-contain" />
                                <div class="text-left">
                                    <h1 class="text-3xl font-bold text-white tracking-tight">BSS PDF</h1>
                                    <p class="text-blue-200/70 text-sm">Toolkit</p>
                                </div>
                            </div>
                            <p class="text-blue-200/70 text-sm">Alat pengolah dokumen harian internal</p>
                        </div>

                        <!-- Login Card -->
                        <div class="bg-white/95 glass-effect rounded-2xl shadow-2xl border border-white/20 p-8">
                            <div class="mb-6">
                                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Simulasi Login Sebagai:</label>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="setLoginRole('user')" id="btn-role-user" class="role-btn py-3 px-4 rounded-xl text-sm font-semibold transition-all border-2 border-slate-200 bg-white text-slate-600 hover:border-blue-300 hover:bg-blue-50">
                                        <div class="flex items-center justify-center gap-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                            Regular User
                                        </div>
                                    </button>
                                    <button onclick="setLoginRole('admin')" id="btn-role-admin" class="role-btn py-3 px-4 rounded-xl text-sm font-semibold transition-all border-2 border-slate-200 bg-white text-slate-600 hover:border-purple-300 hover:bg-purple-50">
                                        <div class="flex items-center justify-center gap-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                                            System Admin
                                        </div>
                                    </button>
                                </div>
                            </div>

                            <button onclick="handleLogin()" class="w-full flex items-center justify-center gap-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-3.5 px-4 rounded-xl hover:from-blue-700 hover:to-indigo-700 transition-all focus:outline-none focus:ring-4 focus:ring-blue-200 shadow-lg shadow-blue-500/25">
                                <svg class="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Masuk dengan Google
                            </button>

                            <p class="mt-5 text-xs text-center text-slate-400">
                                Dengan masuk, Anda menyetujui kebijakan privasi internal perusahaan.
                            </p>
                        </div>

                        <!-- Security Statement -->
                        <div class="mt-6 bg-white/5 glass-effect border border-white/10 rounded-xl p-5 text-center">
                            <div class="flex items-center justify-center gap-2 mb-2">
                                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                                <h4 class="font-bold text-white text-xs tracking-wider">PERNYATAAN KEAMANAN & PRIVASI DOKUMEN (100% CLIENT-SIDE)</h4>
                            </div>
                            <p class="text-blue-200/60 text-xs leading-relaxed">
                                Kami menjamin keamanan dan privasi mutlak atas seluruh dokumen Anda. Aplikasi ini dirancang agar pemrosesan file PDF berjalan 100% secara lokal di dalam browser Anda (Client-Side). File PDF Anda tidak pernah diunggah ke server mana pun, melainkan diproses langsung oleh browser pada perangkat Anda secara mandiri, instan, dan aman. Dokumen Anda tetap berada di dalam kendali penuh Anda.
                            </p>
                            <p class="text-red-400 font-bold text-sm tracking-wide mt-3">Say NO to I LOVE PDF / SMALL PDF</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMain() {
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-grid', roles: ['user', 'admin'] },
                { id: 'merge', label: 'Merge PDF', icon: 'layers', roles: ['user', 'admin'] },
                { id: 'compress', label: 'Compress PDF', icon: 'minimize-2', roles: ['user', 'admin'] },
                { id: 'rearrange', label: 'Rearrange PDF', icon: 'grid-3x3', roles: ['user', 'admin'] },
                { id: 'admin', label: 'Audit Logs', icon: 'shield-alert', roles: ['admin'] },
            ];

            const filteredNav = navItems.filter(item => item.roles.includes(state.user.role));

            return `
                <div class="flex h-screen bg-slate-50 overflow-hidden">
                    ${state.isProcessing ? renderLoader() : ''}
                    ${state.toast ? renderToast() : ''}

                    <!-- Sidebar -->
                    <aside class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-white border-r border-slate-200/80 transform transition-transform duration-300 ease-in-out ${state.isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} flex flex-col shadow-xl md:shadow-none">
                        <!-- Logo -->
                        <div class="py-6 px-6 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <img src="${LOGO_URL}" alt="BSS Logo" class="h-14 object-contain" />
                                <div>
                                    <span class="text-lg font-bold text-slate-800 tracking-tight">BSS PDF</span>
                                    <span class="block text-[10px] text-slate-400 font-medium uppercase tracking-wider">Toolkit v1.0</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Navigation -->
                        <div class="flex-1 py-4 px-3 space-y-1 overflow-y-auto scrollbar-thin">
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-3">Menu Utama</div>
                            ${filteredNav.map(item => `
                                <button onclick="setActiveTab('${item.id}')" class="w-full flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${state.activeTab === item.id ? 'sidebar-active text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}">
                                    <i data-lucide="${item.icon}" class="w-5 h-5 mr-3 ${state.activeTab === item.id ? 'text-blue-600' : 'text-slate-400'}"></i>
                                    ${item.label}
                                    ${item.id === 'admin' ? '<span class="ml-auto text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-semibold">ADMIN</span>' : ''}
                                </button>
                            `).join('')}
                        </div>

                        <!-- User Profile -->
                        <div class="p-4 border-t border-slate-100">
                            <div class="flex items-center px-3 py-2.5 mb-2 bg-gradient-to-r from-slate-50 to-blue-50/50 rounded-xl border border-slate-100">
                                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center font-bold text-sm mr-3 shadow-md shadow-blue-500/20">
                                    ${state.user.name.charAt(0).toUpperCase()}
                                </div>
                                <div class="overflow-hidden flex-1">
                                    <p class="text-sm font-semibold text-slate-800 truncate">${state.user.name}</p>
                                    <p class="text-xs text-slate-500 truncate">${state.user.email}</p>
                                </div>
                                <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400/50"></div>
                            </div>
                            <button onclick="handleLogout()" class="w-full flex items-center px-3 py-2.5 text-sm font-medium text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                                <i data-lucide="log-out" class="w-4 h-4 mr-3"></i>
                                Keluar
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content -->
                    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
                        <!-- Header -->
                        <header class="h-16 bg-white/80 glass-effect border-b border-slate-200/80 flex items-center px-4 md:px-8 justify-between flex-shrink-0">
                            <div class="flex items-center gap-4">
                                <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                                    <i data-lucide="menu" class="w-5 h-5"></i>
                                </button>
                                <div>
                                    <h2 class="text-lg font-bold text-slate-800">${getPageTitle()}</h2>
                                    <p class="text-xs text-slate-500 hidden sm:block">${getPageSubtitle()}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 border border-emerald-200 rounded-full">
                                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                                    <span class="text-xs font-medium text-emerald-700">Client-Side Active</span>
                                </div>
                            </div>
                        </header>

                        <!-- Content -->
                        <div class="flex-1 overflow-y-auto p-4 md:p-8 scrollbar-thin">
                            <div class="max-w-5xl mx-auto w-full animate-fade-in">
                                ${renderContent()}
                            </div>
                        </div>

                        <!-- Footer -->
                        <footer class="flex-shrink-0 border-t border-slate-200/80 bg-white/60 glass-effect px-4 md:px-8 py-3">
                            <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
                                <span>© 2026 Bank Sahabat Sampoerna. Internal use only.</span>
                                <span class="flex items-center gap-1.5">
                                    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500"></i>
                                    100% Client-Side Processing
                                </span>
                            </div>
                        </footer>

                        <!-- Mobile backdrop -->
                        ${state.isMobileMenuOpen ? `<div class="fixed inset-0 bg-slate-900/50 z-30 md:hidden" onclick="toggleMobileMenu()"></div>` : ''}
                    </main>
                </div>
            `;
        }

        function getPageTitle() {
            const titles = {
                dashboard: 'Dashboard',
                merge: 'Gabung PDF',
                compress: 'Kompres PDF',
                rearrange: 'Atur Ulang PDF',
                admin: 'Audit Logs'
            };
            return titles[state.activeTab] || 'Dashboard';
        }

        function getPageSubtitle() {
            const subtitles = {
                dashboard: 'Ringkasan aktivitas dan akses cepat ke tools',
                merge: 'Gabungkan 2 hingga 10 file PDF menjadi satu',
                compress: 'Kurangi ukuran file PDF tanpa kehilangan kualitas',
                rearrange: 'Ubah urutan, hapus, atau putar halaman PDF',
                admin: 'Pemantauan aktivitas PDF (Stateless compliance)'
            };
            return subtitles[state.activeTab] || '';
        }

        function renderContent() {
            switch(state.activeTab) {
                case 'dashboard': return renderDashboard();
                case 'merge': return renderMergeTool();
                case 'compress': return renderCompressTool();
                case 'rearrange': return renderRearrangeTool();
                case 'admin': return renderAdminView();
                default: return renderDashboard();
            }
        }

        function renderDashboard() {
            const stats = [
                { label: 'Total Proses Hari Ini', value: '24', change: '+12%', icon: 'file-text', color: 'blue' },
                { label: 'File Dikompresi', value: '8', change: '+5%', icon: 'minimize-2', color: 'emerald' },
                { label: 'Halaman Diatur', value: '156', change: '+23%', icon: 'grid-3x3', color: 'purple' },
                { label: 'Berhasil', value: '98.2%', change: '+0.3%', icon: 'check-circle-2', color: 'amber' },
            ];

            const recentActivity = MOCK_AUDIT_LOGS.slice(0, 4);

            return `
                <!-- Welcome Banner -->
                <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 rounded-2xl p-6 md:p-8 mb-8 text-white relative overflow-hidden">
                    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA2MCAwIEwgMCAwIDAgNjAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] opacity-50"></div>
                    <div class="relative z-10">
                        <h3 class="text-2xl font-bold mb-2">Selamat datang, ${state.user.name.split(' ')[0]}! 👋</h3>
                        <p class="text-blue-100 text-sm max-w-lg">Kelola dokumen PDF Anda dengan aman dan cepat. Semua pemrosesan dilakukan secara lokal di browser Anda.</p>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    ${stats.map(stat => `
                        <div class="bg-white rounded-xl border border-slate-200/80 p-5 hover-lift">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-10 h-10 rounded-xl bg-${stat.color}-50 flex items-center justify-center">
                                    <i data-lucide="${stat.icon}" class="w-5 h-5 text-${stat.color}-600"></i>
                                </div>
                                <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full">${stat.change}</span>
                            </div>
                            <div class="text-2xl font-bold text-slate-800">${stat.value}</div>
                            <div class="text-xs text-slate-500 mt-1">${stat.label}</div>
                        </div>
                    `).join('')}
                </div>

                <!-- Quick Actions -->
                <div class="mb-8">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4">Akses Cepat</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <button onclick="setActiveTab('merge')" class="group bg-white rounded-xl border border-slate-200/80 p-5 hover-lift text-left">
                            <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center mb-3 group-hover:bg-blue-100 transition-colors">
                                <i data-lucide="layers" class="w-6 h-6 text-blue-600"></i>
                            </div>
                            <h4 class="font-semibold text-slate-800 mb-1">Gabung PDF</h4>
                            <p class="text-xs text-slate-500">Gabungkan 2-10 file PDF menjadi satu dokumen</p>
                        </button>
                        <button onclick="setActiveTab('compress')" class="group bg-white rounded-xl border border-slate-200/80 p-5 hover-lift text-left">
                            <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center mb-3 group-hover:bg-emerald-100 transition-colors">
                                <i data-lucide="minimize-2" class="w-6 h-6 text-emerald-600"></i>
                            </div>
                            <h4 class="font-semibold text-slate-800 mb-1">Kompres PDF</h4>
                            <p class="text-xs text-slate-500">Kurangi ukuran file untuk email & upload</p>

                                <i data-lucide="activity" class="w-4 h-4 text-slate-600"></i>
                            </div>
                            <span class="text-xs font-medium text-slate-500">Total Log</span>
                        </div>
                        <div class="text-2xl font-bold text-slate-800">${totalLogs}</div>
                    </div>
                    <div class="bg-white rounded-xl border border-slate-200/80 p-5">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-9 h-9 rounded-lg bg-emerald-100 flex items-center justify-center">
                                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
                            </div>
                            <span class="text-xs font-medium text-slate-500">Berhasil</span>
                        </div>
                        <div class="text-2xl font-bold text-emerald-600">${successCount}</div>
                    </div>
                    <div class="bg-white rounded-xl border border-slate-200/80 p-5">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-9 h-9 rounded-lg bg-red-100 flex items-center justify-center">
                                <i data-lucide="x-circle" class="w-4 h-4 text-red-600"></i>
                            </div>
                            <span class="text-xs font-medium text-slate-500">Gagal</span>
                        </div>
                        <div class="text-2xl font-bold text-red-600">${errorCount}</div>
                    </div>
                </div>

                <!-- Audit Table -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center">
                                <i data-lucide="shield-alert" class="w-5 h-5 text-slate-600"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">Audit Logs</h2>
                                <p class="text-xs text-slate-500">Pemantauan aktivitas PDF</p>
                            </div>
                        </div>
                        <button class="flex items-center gap-2 bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium hover:bg-slate-50 transition-colors">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            Export CSV
                        </button>
                    </div>

                    <!-- Filters -->
                    <div class="px-6 py-3 bg-slate-50/50 border-b border-slate-100 flex flex-col sm:flex-row gap-3">
                        <div class="relative flex-1 max-w-sm">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" value="${state.auditSearch}" oninput="state.auditSearch=this.value;render()" placeholder="Cari user email..." class="w-full pl-9 pr-4 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none bg-white">
                        </div>
                        <div class="relative">
                            <i data-lucide="filter" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <select onchange="state.auditFilter=this.value;render()" class="pl-9 pr-8 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none appearance-none bg-white cursor-pointer">
                                <option value="">Semua Aksi</option>
                                <option value="MERGE" ${state.auditFilter === 'MERGE' ? 'selected' : ''}>MERGE</option>
                                <option value="COMPRESS" ${state.auditFilter === 'COMPRESS' ? 'selected' : ''}>COMPRESS</option>
                                <option value="REARRANGE" ${state.auditFilter === 'REARRANGE' ? 'selected' : ''}>REARRANGE</option>
                            </select>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="text-xs text-slate-500 uppercase bg-slate-50/80 border-b border-slate-200">
                                    <th class="px-6 py-3 font-semibold">Timestamp</th>
                                    <th class="px-6 py-3 font-semibold">User</th>
                                    <th class="px-6 py-3 font-semibold">Action</th>
                                    <th class="px-6 py-3 font-semibold">Source</th>
                                    <th class="px-6 py-3 font-semibold">Status</th>
                                    <th class="px-6 py-3 font-semibold text-right">Durasi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filteredLogs.map(log => `
                                    <tr class="hover:bg-slate-50/50 transition-colors">
                                        <td class="px-6 py-3.5 whitespace-nowrap text-slate-500 text-xs font-mono">${log.timestamp}</td>
                                        <td class="px-6 py-3.5">
                                            <div class="flex items-center gap-2">
                                                <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 text-white flex items-center justify-center text-xs font-bold">${log.user.charAt(0).toUpperCase()}</div>
                                                <span class="font-medium text-slate-800 text-xs">${log.user}</span>
                                            </div>
                                        </td>
                                        <td class="px-6 py-3.5">
                                            <span class="px-2 py-1 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-700">${log.action}</span>
                                        </td>
                                        <td class="px-6 py-3.5 truncate max-w-[180px] text-slate-600 text-xs" title="${log.source}">${log.source}</td>
                                        <td class="px-6 py-3.5">
                                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${getStatusBadgeClass(log.status)}">
                                                <i data-lucide="${getStatusIcon(log.status)}" class="w-3 h-3"></i>
                                                ${getStatusText(log.status)}
                                            </span>
                                        </td>
                                        <td class="px-6 py-3.5 text-right text-slate-500 text-xs font-mono">${log.duration}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    ${filteredLogs.length === 0 ? `
                        <div class="p-8 text-center">
                            <i data-lucide="search-x" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i>
                            <p class="text-sm text-slate-500">Tidak ada data yang cocok dengan filter</p>
                        </div>
                    ` : ''}

                    <div class="px-6 py-3 text-center text-xs text-slate-400 border-t border-slate-100 bg-slate-50/30">
                        Menampilkan ${filteredLogs.length} dari ${totalLogs} data
                    </div>
                </div>
            `;
        }

        function getStatusBadgeClass(status) {
            const map = {
                SUCCESS: 'bg-emerald-50 text-emerald-700 border border-emerald-200',
                ERROR: 'bg-red-50 text-red-700 border border-red-200',
                CANCELLED: 'bg-amber-50 text-amber-700 border border-amber-200'
            };
            return map[status] || 'bg-slate-50 text-slate-700';
        }

        function renderLoader() {
            return `
                <div class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900/70 glass-effect animate-fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm text-center animate-scale-in border border-slate-100">
                        <div class="relative w-16 h-16 mx-auto mb-6">
                            <div class="absolute inset-0 border-4 border-blue-100 rounded-full"></div>
                            <div class="absolute inset-0 border-4 border-transparent border-t-blue-600 rounded-full animate-spin"></div>
                            <div class="absolute inset-2 border-4 border-transparent border-t-indigo-400 rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 0.8s;"></div>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-2">Memproses Dokumen</h3>
                        <p class="text-slate-500 text-sm leading-relaxed">
                            Sedang memproses dokumen Anda...<br>
                            <span class="font-semibold text-red-500">Mohon jangan tutup halaman ini.</span>
                        </p>
                    </div>
                </div>
            `;
        }

        function renderToast() {
            const t = state.toast;
            const isError = t.type === 'error';
            return `
                <div class="fixed bottom-6 right-6 z-50 animate-slide-up">
                    <div class="flex items-center p-4 rounded-xl shadow-2xl border-l-4 ${isError ? 'bg-white border-red-500' : 'bg-white border-emerald-500'} min-w-[300px]">
                        <div class="w-8 h-8 rounded-full ${isError ? 'bg-red-100' : 'bg-emerald-100'} flex items-center justify-center mr-3 flex-shrink-0">
                            <i data-lucide="${isError ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 ${isError ? 'text-red-600' : 'text-emerald-600'}"></i>
                        </div>
                        <p class="font-medium text-sm text-slate-800 flex-1">${t.message}</p>
                        <button onclick="state.toast=null;render()" class="ml-3 text-slate-400 hover:text-slate-600 p-1">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Event Handlers
        function setLoginRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.className = 'role-btn py-3 px-4 rounded-xl text-sm font-semibold transition-all border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300';
            });
            const activeBtn = document.getElementById(`btn-role-${role}`);
            if (role === 'user') {
                activeBtn.className = 'role-btn py-3 px-4 rounded-xl text-sm font-semibold transition-all border-2 border-blue-500 bg-blue-50 text-blue-700 shadow-md shadow-blue-500/10';
            } else {
                activeBtn.className = 'role-btn py-3 px-4 rounded-xl text-sm font-semibold transition-all border-2 border-purple-500 bg-purple-50 text-purple-700 shadow-md shadow-purple-500/10';
            }
            state.loginRole = role;
        }

        function handleLogin() {
            const role = state.loginRole || 'user';
            state.user = { role, name: role === 'admin' ? 'Admin User' : 'Regular User', email: `${role}@company.com` };
            state.activeTab = role === 'admin' ? 'dashboard' : 'dashboard';
            render();
        }

        function handleLogout() {
            state.user = null;
            state.activeTab = 'dashboard';
            state.mergeFiles = [];
            state.compressFile = null;
            state.rearrangeFile = null;
            state.rearrangePages = [];
            render();
        }

        function setActiveTab(tab) {
            state.activeTab = tab;
            state.isMobileMenuOpen = false;
            render();
        }

        function toggleMobileMenu() {
            state.isMobileMenuOpen = !state.isMobileMenuOpen;
            render();
        }

        function showToast(message, type = 'success') {
            state.toast = { message, type };
            render();
            setTimeout(() => { state.toast = null; render(); }, 4000);
        }

        // Merge handlers
        function handleMergeFileSelect(e) {
            const selectedFiles = Array.from(e.target.files);
            if (state.mergeFiles.length + selectedFiles.length > 10) {
                showToast("Maksimal 10 file yang diizinkan.", 'error');
                return;
            }
            const newFiles = selectedFiles.map(file => ({
                id: Math.random().toString(36).substr(2, 9),
                name: file.name,
                size: file.size,
            }));
            state.mergeFiles = [...state.mergeFiles, ...newFiles];
            render();
        }

        function removeMergeFile(id) {
            state.mergeFiles = state.mergeFiles.filter(f => f.id !== id);
            render();
        }

        function onMergeDragStart(index) { state.mergeDragIdx = index; }
        function onMergeDragOver(e, index) {
            e.preventDefault();
            if (state.mergeDragIdx === null || state.mergeDragIdx === index) return;
            const newFiles = [...state.mergeFiles];
            const draggedItem = newFiles[state.mergeDragIdx];
            newFiles.splice(state.mergeDragIdx, 1);
            newFiles.splice(index, 0, draggedItem);
            state.mergeDragIdx = index;
            state.mergeFiles = newFiles;
            render();
        }
        function onMergeDragEnd() { state.mergeDragIdx = null; render(); }

        function handleMerge() {
            if (state.mergeFiles.length < 2) {
                showToast("Pilih minimal 2 file untuk digabungkan.", 'error');
                return;
            }
            simulateProcessing('merge');
        }

        // Compress handlers
        function handleCompressFileSelect(e) {
            const file = e.target.files[0];
            if (file) state.compressFile = file;
            render();
        }

        function handleCompress() {
            if (!state.compressFile) {
                showToast("Pilih file terlebih dahulu.", 'error');
                return;
            }
            simulateProcessing('compress');
        }

        // Rearrange handlers
        function handleRearrangeFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                state.rearrangeFile = file;
                const mockPageCount = Math.floor(Math.random() * 8) + 5;
                state.rearrangePages = Array.from({ length: mockPageCount }, (_, i) => ({
                    id: `page-${i + 1}`,
                    originalNumber: i + 1,
                    rotation: 0
                }));
            }
            render();
        }

        function handleRotatePage(index, e) {
            e.stopPropagation();
            state.rearrangePages[index].rotation = (state.rearrangePages[index].rotation + 90) % 360;
            render();
        }

        function handleDeletePage(index, e) {
            e.stopPropagation();
            state.rearrangePages.splice(index, 1);
            render();
        }

        function onRearrangeDragStart(index) { state.rearrangeDragIdx = index; }
        function onRearrangeDragOver(e, index) {
            e.preventDefault();
            if (state.rearrangeDragIdx === null || state.rearrangeDragIdx === index) return;
            const newPages = [...state.rearrangePages];
            const draggedItem = newPages[state.rearrangeDragIdx];
            newPages.splice(state.rearrangeDragIdx, 1);
            newPages.splice(index, 0, draggedItem);
            state.rearrangeDragIdx = index;
            state.rearrangePages = newPages;
            render();
        }
        function onRearrangeDragEnd() { state.rearrangeDragIdx = null; render(); }

        function handleRearrange() {
            if (state.rearrangePages.length === 0) return;
            simulateProcessing('rearrange');
        }

        function simulateProcessing(actionName) {
            state.isProcessing = true;
            render();
            const processingTime = Math.random() * 2000 + 1500;
            setTimeout(() => {
                state.isProcessing = false;
                const isSuccess = Math.random() > 0.1;
                if (isSuccess) {
                    let msg = "Dokumen berhasil diproses dan diunduh.";
                    if (actionName === 'compress') {
                        const reduced = Math.floor(Math.random() * 40) + 10;
                        msg = `Berhasil dikompresi! Ukuran berkurang ${reduced}%.`;
                    }
                    showToast(msg, 'success');
                } else {
                    showToast("Terjadi kesalahan. Silakan coba lagi.", 'error');
                }
                render();
            }, processingTime);
        }

        function attachEvents() {
            // Drag over visual feedback for drop zones
            const dropZones = document.querySelectorAll('[id$="-drop-zone"]');
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                });
            });
        }

        // Initialize
        state.loginRole = 'user';
        render();
    </script>
</body>
</html>
